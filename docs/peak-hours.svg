<svg xmlns="http://www.w3.org/2000/svg" width="760" height="300" viewBox="0 0 760 300" role="img" aria-label="The tracker: a floating panel, the same panel in the sidebar collapsed, the same panel expanded with details, and the collapsed rail showing only the dot">
  <defs>
    <radialGradient id="bandBlue" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#5aa2ff" stop-opacity="0.34"/>
      <stop offset="45%" stop-color="#5aa2ff" stop-opacity="0.3"/>
      <stop offset="62%" stop-color="#5aa2ff" stop-opacity="0.12"/>
      <stop offset="100%" stop-color="#5aa2ff" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="bandAmber" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#f5c542" stop-opacity="0.34"/>
      <stop offset="45%" stop-color="#f5c542" stop-opacity="0.3"/>
      <stop offset="62%" stop-color="#f5c542" stop-opacity="0.12"/>
      <stop offset="100%" stop-color="#f5c542" stop-opacity="0"/>
    </radialGradient>
  </defs>
  <rect width="760" height="300" fill="#101216"/>
  <text x="26" y="30" fill="#8b93a1" font-family="Segoe UI, system-ui, sans-serif" font-size="12" letter-spacing="1.6">PEAK HOURS · SAME PANEL, TWO PLACEMENTS</text>

  <!-- floating -->
  <g transform="translate(26, 52)">
    <text x="0" y="10" fill="#6f7787" font-family="Segoe UI, system-ui, sans-serif" font-size="11" letter-spacing="1.1">FLOATING · DRAG TO MOVE</text>
    <rect x="0" y="24" width="196" height="104" rx="12" fill="#1b1e25" stroke="#2b303a"/>
    <circle cx="21" cy="44" r="8" fill="url(#bandBlue)"/>
    <circle cx="21" cy="44" r="4" fill="#5aa2ff"/>
    <text x="36" y="48" fill="#a8cbff" font-family="Segoe UI, system-ui, sans-serif" font-size="11" font-weight="650" letter-spacing="0.6">OFF-PEAK</text>
    <rect x="166" y="35" width="18" height="18" rx="5" fill="#22262e"/>
    <path d="M171 38.5v9" stroke="#9aa3b2" stroke-width="1.3" stroke-linecap="round"/>
    <path d="M180.5 43h-6" stroke="#9aa3b2" stroke-width="1.3" stroke-linecap="round"/>
    <path d="M177.5 40.5 175 43l2.5 2.5" stroke="#9aa3b2" stroke-width="1.3" stroke-linecap="round" stroke-linejoin="round" fill="none"/>
    <text x="14" y="72" fill="#7d8697" font-family="Segoe UI, system-ui, sans-serif" font-size="9" font-weight="600" letter-spacing="0.7">LOCAL</text>
    <text x="182" y="72" fill="#e7ebf2" font-family="Consolas, ui-monospace, monospace" font-size="12" text-anchor="end">16:48:12</text>
    <text x="14" y="90" fill="#7d8697" font-family="Segoe UI, system-ui, sans-serif" font-size="9" font-weight="600" letter-spacing="0.7">CHINA</text>
    <text x="182" y="90" fill="#e7ebf2" font-family="Consolas, ui-monospace, monospace" font-size="12" text-anchor="end">00:48:12</text>
    <line x1="10" y1="100" x2="186" y2="100" stroke="#262b33"/>
    <text x="14" y="118" fill="#9aa3b2" font-family="Consolas, ui-monospace, monospace" font-size="10.5">→ peak in</text>
    <text x="182" y="118" fill="#5aa2ff" font-family="Consolas, ui-monospace, monospace" font-size="10.5" font-weight="600" text-anchor="end">1d 8h</text>
    <text x="0" y="148" fill="#6f7787" font-family="Segoe UI, system-ui, sans-serif" font-size="10.5">no hover info · drag only, never expands</text>

    <g transform="translate(0, 178)">
      <text x="0" y="10" fill="#6f7787" font-family="Segoe UI, system-ui, sans-serif" font-size="11" letter-spacing="1.1">COLLAPSED RAIL</text>
      <circle cx="24" cy="50" r="18" fill="#1d2129" stroke="#2b303a"/>
      <circle cx="24" cy="50" r="9" fill="url(#bandBlue)"/>
      <circle cx="24" cy="50" r="4.5" fill="#5aa2ff"/>
      <text x="58" y="46" fill="#9aa3b2" font-family="Segoe UI, system-ui, sans-serif" font-size="10.5">the dot alone —</text>
      <text x="58" y="60" fill="#6f7787" font-family="Segoe UI, system-ui, sans-serif" font-size="10">no time, no text</text>
    </g>
  </g>

  <!-- sidebar collapsed -->
  <g transform="translate(250, 52)">
    <text x="0" y="10" fill="#6f7787" font-family="Segoe UI, system-ui, sans-serif" font-size="11" letter-spacing="1.1">SIDEBAR · ABOVE SETTINGS</text>
    <rect x="0" y="24" width="228" height="190" rx="12" fill="#15181e" stroke="#262b33"/>
    <text x="14" y="46" fill="#6f7787" font-family="Segoe UI, system-ui, sans-serif" font-size="10.5" letter-spacing="0.9">SESSIONS</text>
    <rect x="10" y="54" width="208" height="22" rx="7" fill="#1d2129"/>
    <rect x="10" y="132" width="208" height="70" rx="12" fill="#1b1e25" stroke="#2b303a"/>
    <circle cx="30" cy="152" r="8" fill="url(#bandBlue)"/>
    <circle cx="30" cy="152" r="4" fill="#5aa2ff"/>
    <text x="45" y="156" fill="#a8cbff" font-family="Segoe UI, system-ui, sans-serif" font-size="11" font-weight="650" letter-spacing="0.6">OFF-PEAK</text>
    <path d="M192 139h7v7" stroke="#9aa3b2" stroke-width="1.3" stroke-linecap="round" stroke-linejoin="round" fill="none"/>
    <path d="M199 139l-5 5" stroke="#9aa3b2" stroke-width="1.3" stroke-linecap="round"/>
    <path d="M189 142.5h-3.5a2 2 0 0 0-2 2v7a2 2 0 0 0 2 2h7a2 2 0 0 0 2-2V148" stroke="#9aa3b2" stroke-width="1.3" stroke-linecap="round" fill="none"/>
    <text x="24" y="176" fill="#7d8697" font-family="Segoe UI, system-ui, sans-serif" font-size="9" font-weight="600" letter-spacing="0.7">LOCAL</text>
    <text x="204" y="176" fill="#e7ebf2" font-family="Consolas, ui-monospace, monospace" font-size="12" text-anchor="end">16:48:12</text>
    <text x="24" y="192" fill="#7d8697" font-family="Segoe UI, system-ui, sans-serif" font-size="9" font-weight="600" letter-spacing="0.7">CHINA</text>
    <text x="204" y="192" fill="#e7ebf2" font-family="Consolas, ui-monospace, monospace" font-size="12" text-anchor="end">00:48:12</text>
    <text x="20" y="212" fill="#9aa3b2" font-family="Segoe UI, system-ui, sans-serif" font-size="11">Settings</text>
    <text x="0" y="232" fill="#6f7787" font-family="Segoe UI, system-ui, sans-serif" font-size="10.5">click the card to expand it</text>
  </g>

  <!-- expanded -->
  <g transform="translate(504, 52)">
    <text x="0" y="10" fill="#6f7787" font-family="Segoe UI, system-ui, sans-serif" font-size="11" letter-spacing="1.1">EXPANDED ON CLICK</text>
    <rect x="0" y="24" width="228" height="142" rx="12" fill="#1b1e25" stroke="#2b303a"/>
    <circle cx="20" cy="45" r="8" fill="url(#bandBlue)"/>
    <circle cx="20" cy="45" r="4" fill="#5aa2ff"/>
    <text x="35" y="49" fill="#a8cbff" font-family="Segoe UI, system-ui, sans-serif" font-size="11" font-weight="650" letter-spacing="0.6">OFF-PEAK</text>
    <path d="M196 33h7v7" stroke="#9aa3b2" stroke-width="1.3" stroke-linecap="round" stroke-linejoin="round" fill="none"/>
    <path d="M203 33l-5 5" stroke="#9aa3b2" stroke-width="1.3" stroke-linecap="round"/>
    <path d="M193 36.5h-3.5a2 2 0 0 0-2 2v7a2 2 0 0 0 2 2h7a2 2 0 0 0 2-2V42" stroke="#9aa3b2" stroke-width="1.3" stroke-linecap="round" fill="none"/>
    <text x="16" y="70" fill="#7d8697" font-family="Segoe UI, system-ui, sans-serif" font-size="9" font-weight="600" letter-spacing="0.7">LOCAL</text>
    <text x="212" y="70" fill="#e7ebf2" font-family="Consolas, ui-monospace, monospace" font-size="12" text-anchor="end">16:48:12</text>
    <text x="16" y="86" fill="#7d8697" font-family="Segoe UI, system-ui, sans-serif" font-size="9" font-weight="600" letter-spacing="0.7">CHINA</text>
    <text x="212" y="86" fill="#e7ebf2" font-family="Consolas, ui-monospace, monospace" font-size="12" text-anchor="end">00:48:12</text>
    <line x1="10" y1="95" x2="218" y2="95" stroke="#262b33"/>
    <text x="16" y="111" fill="#9aa3b2" font-family="Consolas, ui-monospace, monospace" font-size="10.5">→ peak in</text>
    <text x="212" y="111" fill="#5aa2ff" font-family="Consolas, ui-monospace, monospace" font-size="10.5" font-weight="600" text-anchor="end">1d 8h</text>
    <line x1="10" y1="120" x2="218" y2="120" stroke="#262b33"/>
    <text x="16" y="136" fill="#7d8697" font-family="Segoe UI, system-ui, sans-serif" font-size="9" font-weight="600" letter-spacing="0.7">SWITCH</text>
    <text x="212" y="136" fill="#e7ebf2" font-family="Consolas, ui-monospace, monospace" font-size="11" text-anchor="end">22:18 local · 16:48 UTC</text>
    <text x="16" y="152" fill="#7d8697" font-family="Segoe UI, system-ui, sans-serif" font-size="9" font-weight="600" letter-spacing="0.7">TODAY</text>
    <text x="212" y="152" fill="#e7ebf2" font-family="Consolas, ui-monospace, monospace" font-size="11" text-anchor="end">none (weekend)</text>
    <text x="0" y="188" fill="#6f7787" font-family="Segoe UI, system-ui, sans-serif" font-size="10.5">the card grows only as far as the details need</text>

    <g transform="translate(0, 214)">
      <text x="0" y="0" fill="#6f7787" font-family="Segoe UI, system-ui, sans-serif" font-size="11" letter-spacing="1.1">STATE DOT</text>
      <circle cx="16" cy="24" r="11" fill="url(#bandBlue)"/>
      <circle cx="16" cy="24" r="4.5" fill="#5aa2ff"/>
      <text x="34" y="20" fill="#9aa3b2" font-family="Segoe UI, system-ui, sans-serif" font-size="10.5">off-peak</text>
      <text x="34" y="34" fill="#6f7787" font-family="Segoe UI, system-ui, sans-serif" font-size="10">filled dot + lighter bands</text>
      <circle cx="150" cy="24" r="11" fill="url(#bandAmber)"/>
      <circle cx="150" cy="24" r="4.5" fill="#f5c542"/>
      <text x="168" y="20" fill="#9aa3b2" font-family="Segoe UI, system-ui, sans-serif" font-size="10.5">peak</text>
      <text x="168" y="34" fill="#6f7787" font-family="Segoe UI, system-ui, sans-serif" font-size="10">same, in warn amber</text>
    </g>
  </g>
</svg>
