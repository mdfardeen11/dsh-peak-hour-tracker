name: ci

# The tests are plain node scripts with no install step, so CI is just node.
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  test:
    name: node ${{ matrix.node }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        node: [20, 22]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
      # Run the behavioural suite in two zones on purpose: it is the suite that
      # asserts the fiddly details, and a hardcoded local time passes in the
      # author's zone while failing everywhere else. UTC is the CI default;
      # Asia/Kolkata gives it a non-whole-hour offset to be wrong about.
      - name: Behavioural suite (UTC)
        run: node test/logic.test.mjs
        env:
          TZ: UTC
      - name: Behavioural suite (Asia/Kolkata)
        run: node test/logic.test.mjs
        env:
          TZ: Asia/Kolkata
      - name: Worldwide timezone matrix
        run: node test/run-timezones.mjs
      - name: Package manifest sanity
        run: node -e "const p=require('./package.json');if(p.name!=='dsh-peak-hour-tracker')throw new Error('unexpected name');if(!p.dsh||p.dsh.client.platform!=='web'||!p.dsh.bundle.patch)throw new Error('missing dsh declarations');console.log('manifest ok',p.name,p.version)"
